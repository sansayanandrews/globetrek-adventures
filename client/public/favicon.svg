<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Blue rounded square base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#blueGrad)" />
  <!-- White outer ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.85" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <!-- Compass Star: North / South / East / West needles in Pure White -->
  <polygon points="32,15 35,32 32,29 29,32" fill="#ffffff" />
  <polygon points="32,49 35,32 32,35 29,32" fill="#93c5fd" />
  <polygon points="49,32 32,35 35,32 32,29" fill="#dbeafe" />
  <polygon points="15,32 32,35 29,32 32,29" fill="#60a5fa" />
  <!-- Compass Center Pin -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" />
</svg>